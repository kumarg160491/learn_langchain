[project]
name = "learn-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kumar Gaurav", email = "kumarg160491@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.32.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.5",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "transformers>=5.17.0",
]

[project.scripts]
learn-langchain = "learn_langchain:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
